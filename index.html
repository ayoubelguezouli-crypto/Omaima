<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>For Omaima ❤️</title>


<style>
/* ==============================
   GLOBAL RESET
============================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    background: #000;
    font-family: Georgia, serif;

    transition: background 2s ease;
}

/* ==============================
   BACKGROUND
============================== */

body.revealed {
    background: radial-gradient(
        circle at center,
        #321020 0%,
        #160813 48%,
        #000 100%
    );
}

.intro {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    pointer-events: none;
    animation: introFade 1.5s ease 0.7s forwards;
}

@keyframes introFade {
    to {
        opacity: 0;
    }
}

.glow {
    position: absolute;
    width: 300px;
    height: 300px;
    max-width: 80vw;

    background: #ff176b;
    filter: blur(120px);
    opacity: 0;

    pointer-events: none;

    transition: opacity 2s ease;
    animation: breathe 5s infinite alternate;
}

body.revealed .glow {
    opacity: .22;
}

@keyframes breathe {
    from {
        transform: scale(.8);
    }

    to {
        transform: scale(1.3);
    }
}

/* ==============================
   MAIN CONTAINER
============================== */

.container {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 100vw;
    padding: 0 15px;

    display: flex;
    flex-direction: column;
    align-items: center;

    opacity: 0;
    transform: translateY(20px);

    transition:
        opacity 1.3s ease,
        transform 1.3s ease;
}

.container.show {
    opacity: 1;
    transform: translateY(0);
}

/* ==============================
   HEART
============================== */

.heart-wrapper {
    position: relative;

    width: 190px;
    height: 180px;
    flex-shrink: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    filter: drop-shadow(
        0 0 15px rgba(255,30,110,.4)
    );
}

.heart-svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.heart-outline {
    fill: none;
    stroke: #ff72a8;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;

    filter: drop-shadow(0 0 8px #ff3980);
}

.heart-fill {
    fill: url(#heartGradient);
    opacity: 0;

    transform: scale(.7);
    transform-origin: center;
}

.heart-wrapper.draw .heart-outline {
    animation: drawHeart 1.8s ease forwards;
}

.heart-wrapper.fill .heart-fill {
    animation: fillHeart 1s ease forwards;
}

@keyframes drawHeart {
    to {
        stroke-dashoffset: 0;
    }
}

@keyframes fillHeart {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* ==============================
   HEARTBEAT
============================== */

.heart-wrapper.beat {
    animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.07);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.12);
    }

    60% {
        transform: scale(1);
    }
}

/* ==============================
   NAME
============================== */

.name {
    position: absolute;
    top: 49%;
    left: 50%;

    transform: translate(-50%, -50%);

    color: #fff;
    font-size: clamp(28px, 8vw, 43px);
    font-weight: bold;

    letter-spacing: 3px;
    white-space: nowrap;

    opacity: 0;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff80b5;

    transition: opacity 1.3s ease;
}

.name.show {
    opacity: 1;
}

/* ==============================
   SUBTITLE
============================== */

.subtitle {
    margin-top: 30px;

    color: #ffd4e5;

    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 5px;

    text-align: center;

    opacity: 0;
    transform: translateY(12px);

    text-shadow: 0 0 15px #ff5b9b;

    transition: all 1.3s ease;
}

.subtitle.show {
    opacity: 1;
    transform: translateY(0);
}

/* ==============================
   DECORATIVE LINE
============================== */

.line {
    width: 0;
    height: 1px;

    margin-top: 20px;

    background: linear-gradient(
        90deg,
        transparent,
        #ff75aa,
        transparent
    );

    transition: width 1.3s ease;
}

.line.show {
    width: 130px;
}

/* ==============================
   FLOATING HEARTS
============================== */

.particle {
    position: absolute;
    bottom: -30px;

    color: #ff75aa;

    pointer-events: none;

    filter: drop-shadow(0 0 8px #ff3980);

    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg) scale(.5);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.4);
        opacity: 0;
    }
}

/* ==============================
   SPARKLES
============================== */

.sparkle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;
    background: #fff;

    box-shadow: 0 0 12px 3px #ff80b5;

    pointer-events: none;

    opacity: 0;

    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    0% {
        opacity: 0;
        transform: scale(.3);
    }

    100% {
        opacity: .9;
        transform: scale(1.8);
    }
}

/* ==============================
   FOOTER
============================== */

.footer {
    position: absolute;
    bottom: 30px;

    max-width: 100%;
    padding: 0 10px;

    color: rgba(255,255,255,.4);

    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;

    text-align: center;

    opacity: 0;

    transition: opacity 1.3s ease;
}

.footer.show {
    opacity: 1;
}

/* ==============================
   MOBILE RESPONSIVE
============================== */

@media (max-width: 480px) {

    .heart-wrapper {
        width: 145px;
        height: 140px;
    }

    .name {
        font-size: 32px;
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: 3px;
        margin-top: 25px;
    }

    .footer {
        bottom: 18px;
        font-size: 9px;
        letter-spacing: 3px;
    }

    .glow {
        width: 220px;
        height: 220px;
        filter: blur(100px);
    }
}

/* ==============================
   SMALL HEIGHT SCREENS
============================== */

@media (max-height: 600px) {

    .heart-wrapper {
        width: 125px;
        height: 120px;
    }

    .subtitle {
        margin-top: 15px;
    }

    .line {
        margin-top: 12px;
    }

    .footer {
        bottom: 10px;
    }
}

/* ==============================
   REDUCED MOTION
============================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>

</head>

<body>

<div class="intro"></div>
<div class="glow"></div>

<!-- MAIN CONTENT -->

<div class="container" id="container">

    <div class="heart-wrapper" id="heart">

        <svg class="heart-svg" viewBox="0 0 200 190">

            <defs>
                <linearGradient id="heartGradient"
                    x1="0%" y1="0%" x2="100%" y2="100%">

                    <stop offset="0%" stop-color="#ff9fc5"/>
                    <stop offset="50%" stop-color="#ff287b"/>
                    <stop offset="100%" stop-color="#b90050"/>

                </linearGradient>
            </defs>

            <path class="heart-fill"
                d="M100 175
                C80 155 15 105 15 58
                C15 5 82 -5 100 43
                C118 -5 185 5 185 58
                C185 105 120 155 100 175Z"/>

            <path class="heart-outline"
                d="M100 175
                C80 155 15 105 15 58
                C15 5 82 -5 100 43
                C118 -5 185 5 185 58
                C185 105 120 155 100 175Z"/>

        </svg>

        <div class="name" id="name">Omaima</div>

    </div>

    <div class="subtitle" id="subtitle">
        YOU ARE SPECIAL ❤️
    </div>

    <div class="line" id="line"></div>

</div>

<div class="footer" id="footer">
    MADE WITH LOVE
</div>

<script>

/* DELAY FUNCTION */

const delay = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

/* CINEMATIC INTRO */

async function startAnimation() {

    await delay(700);

    document.body.classList.add("revealed");

    await delay(400);

    createSparkles();

    const container = document.getElementById("container");
    const heart = document.getElementById("heart");

    container.classList.add("show");

    await delay(600);

    heart.classList.add("draw");

    await delay(1800);

    heart.classList.add("fill");

    await delay(900);

    document.getElementById("name").classList.add("show");

    await delay(600);

    document.getElementById("subtitle").classList.add("show");

    await delay(400);

    document.getElementById("line").classList.add("show");

    await delay(500);

    document.getElementById("footer").classList.add("show");

    await delay(700);

    heart.classList.add("beat");

    startParticles();
}

/* FLOATING HEARTS */

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "particle";

    const symbols = ["♥", "♡", "❤", "💕"];

    heart.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (12 + Math.random() * 22) + "px";

    const duration = 6 + Math.random() * 6;

    heart.style.animationDuration = duration + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), duration * 1000);
}

/* START PARTICLES */

function startParticles() {

    createHeart();

    setInterval(() => {

        if (document.hidden) return;

        createHeart();

    }, 500);
}

/* BACKGROUND SPARKLES */

function createSparkles() {

    for (let i = 0; i < 40; i++) {

        const sparkle = document.createElement("div");

        sparkle.className = "sparkle";

        sparkle.style.left = Math.random() * 100 + "vw";
        sparkle.style.top = Math.random() * 100 + "vh";

        sparkle.style.animationDelay =
            Math.random() * 3 + "s";

        sparkle.style.animationDuration =
            (2 + Math.random() * 3) + "s";

        document.body.appendChild(sparkle);
    }
}

/* START */

window.addEventListener("load", startAnimation);

</script>

</body>
</html>
