
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Omaima ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #35152f, #160b25 55%, #090817);
    font-family: 'Georgia', serif;
}

/* Background glow */
.glow {
    position: absolute;
    width: 350px;
    height: 350px;
    background: #ff287b;
    filter: blur(150px);
    opacity: 0.25;
    animation: glow 4s infinite alternate;
}

@keyframes glow {
    from { transform: scale(.8); opacity: .15; }
    to { transform: scale(1.3); opacity: .35; }
}

/* Main container */
.container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
}

/* Heart */
.heart {
    position: relative;
    width: 130px;
    height: 130px;
    background: linear-gradient(135deg, #ff8eb7, #ff176b 55%, #c90053);
    transform: rotate(-45deg);
    animation: heartbeat 1.15s infinite;
    box-shadow:
        0 0 25px #ff267b,
        0 0 60px #ff267b,
        0 0 100px rgba(255, 30, 110, .4);
    border-radius: 12px;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    background: inherit;
    border-radius: 50%;
}

.heart::before {
    top: -65px;
    left: 0;
}

.heart::after {
    left: 65px;
    top: 0;
}

@keyframes heartbeat {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }
    15% {
        transform: rotate(-45deg) scale(1.13);
    }
    30% {
        transform: rotate(-45deg) scale(1);
    }
    45% {
        transform: rotate(-45deg) scale(1.18);
    }
    60% {
        transform: rotate(-45deg) scale(1);
    }
}

/* Name */
.name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    color: white;
    font-size: clamp(30px, 8vw, 43px);
    font-weight: bold;
    white-space: nowrap;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #fff, 0 0 25px #ffb2d0;
    animation: nameGlow 2s infinite alternate;
}

@keyframes nameGlow {
    from { text-shadow: 0 0 10px white; }
    to { text-shadow: 0 0 20px white, 0 0 35px #ffb2d0; }
}

/* Subtitle */
.subtitle {
    margin-top: 110px;
    color: #ffd4e5;
    font-size: 18px;
    letter-spacing: 4px;
    opacity: 0;
    animation: appear 2s ease 1s forwards;
    text-shadow: 0 0 15px #ff5b9b;
}

@keyframes appear {
    to { opacity: 1; }
}

/* Floating hearts */
.particle {
    position: absolute;
    bottom: -30px;
    color: #ff75aa;
    pointer-events: none;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 0 7px #ff3980);
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg) scale(.5);
        opacity: 0;
    }
    15% { opacity: 1; }
    100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.5);
        opacity: 0;
    }
}

/* Sparkles */
.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 12px 3px #ff80b5;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.5); }
    to { opacity: 1; transform: scale(1.8); }
}

/* Footer */
.footer {
    position: absolute;
    bottom: 30px;
    color: rgba(255,255,255,.5);
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
}

/* Responsive */
@media(max-width: 480px) {
    .heart {
        width: 105px;
        height: 105px;
    }

    .heart::before,
    .heart::after {
        width: 105px;
        height: 105px;
    }

    .heart::before { top: -52px; }
    .heart::after { left: 52px; }

    .subtitle {
        font-size: 14px;
        letter-spacing: 3px;
    }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
    <div class="heart"></div>
    <div class="name">Omaima</div>
    <div class="subtitle">YOU ARE SPECIAL ❤️</div>
</div>

<div class="footer">MADE WITH LOVE</div>

<script>

// Create floating hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "particle";

    const symbols = ["♥", "♡", "❤", "💕"];
    heart.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random() * 22) + "px";
    heart.style.animationDuration = (5 + Math.random() * 6) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 11000);
}

setInterval(createHeart, 350);

// Create background sparkles
function createSparkle() {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";

    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.top = Math.random() * 100 + "vh";
    sparkle.style.animationDelay = Math.random() * 2 + "s";

    document.body.appendChild(sparkle);
}

for (let i = 0; i < 45; i++) {
    createSparkle();
}

</script>

</body>
</html>
